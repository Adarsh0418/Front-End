<h3>Registration Form</h3>
<fieldset style="width: 400px;"> 
    <legend>Student Information</legend>
<form>
    <label for="fname">FirstName:</label>
    <input type="text" placeholder="firstname" id="fname" 
    required> <br><br>

    <label>Email:</label>
    <input type="email" title="priya@gmail.com"><br><br>

    <label>Password:</label>
    <input type="password"><br><br>

    <label>Age</label>
    <input type="number" min="18" max="35"><br><br>

    <labe>DOB:</labe>
    <input type="date"><br><br>

    <label>URL:</label>
    <input type="url"><br><br>

    <label>Color Choice:</label>
    <input type="color"><br><br>

    <label>Skills:</label>
    <input type="checkbox" value="reactjs">React
    <input type="checkbox" value="java">Java
    <input type="checkbox" value="sql">sql
    <br><br>

    <label>Gender:</label>
    <input type="radio" name="gender">Male
    <input type="radio" name="gender">Female 
    <input type="radio" name="gender">Other
    <br><br>

    <label>City:</label>
    <select>
        <option>Pune</option>
        <option>Banglore</option>
        <option>nagpur</option>
    </select>
    <br><br>

    <textarea>Write your feedbacl here..</textarea>
    <br><br>

    <label>Upload File</label>
    <input type="file" accept="pdf">
    <br><br>

    <input type="range">
    <input type="reset">
    <br><br>

    <button type="submit">Submit</button>
</form>
</fieldset>
